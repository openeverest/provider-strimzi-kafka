# The smallest valid Instance of this provider. Copy it per case and change
# what the case is about.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example
spec:
  providerRef:
    name: strimzi-kafka
  version: "4.3.2"
  topology:
    type: dualRole
  components:
    engine:
      type: kafka
      replicas: 1
      storage:
        size: 10Gi
