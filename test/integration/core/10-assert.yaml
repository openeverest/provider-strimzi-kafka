# Expected outcome of the create-instance step.
#
# Assert both the accepted Instance spec and the operator-native CRs Sync()
# creates. Chainsaw asserts are partial: only the fields listed here are checked.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
spec:
  providerRef:
    name: strimzi-kafka
  topology:
    type: dualRole
  components:
    engine:
      type: kafka
      replicas: 1
---
# KafkaNodePool — dual-role shape; name is <instance>-dual-role so multiple
# Instances in one namespace cannot collide on a shared pool object.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: test-instance-dual-role
  labels:
    strimzi.io/cluster: test-instance
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: test-instance
spec:
  kafka:
    version: "4.3.2"
    metadataVersion: "4.3-IV0"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
