# Sample Instance for the create-instance step.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
spec:
  providerRef:
    name: strimzi-kafka
  version: "4.3.2"
  topology:
    type: dualRole
  components:
    engine:
      type: kafka
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 512Mi
      storage:
        size: 10Gi
