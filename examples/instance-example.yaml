# Dual-role Kafka Instance (3 nodes) — matches Strimzi
# examples/kafka/kafka-with-dual-role-nodes.yaml shape (RF=3, min.isr=2).
#
# Prerequisites:
#   1. OpenEverest CRDs installed
#   2. provider-strimzi-kafka chart installed (includes Strimzi operator)
#   3. Provider controller running
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example-kafka
spec:
  providerRef:
    name: strimzi-kafka
  version: "4.3.2"
  topology:
    type: dualRole
  components:
    engine:
      type: kafka
      replicas: 3
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
      storage:
        size: 100Gi
