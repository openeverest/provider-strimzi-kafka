# dualRole topology — one KafkaNodePool with combined controller+broker roles.
#
# Matches Strimzi 1.3.1 examples:
#   examples/kafka/kafka-with-dual-role-nodes.yaml (replicas: 3)
#   examples/kafka/kafka-single-node.yaml (replicas: 1)
#
# See github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md

config:
  components:
    engine:
      defaults:
        replicas: 3

ui:
  sections:
    basicInfo:
      label: Basic Information
      description: Choose the Kafka version for this cluster.
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: Kafka Version
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: name
              valuePath: name
            modes:
              edit:
                disabled: true
              restore:
                disabled: true
          validation:
            required: true
      componentsOrder:
        - version
    resources:
      label: Resources
      description: Size the dual-role Kafka nodes (controllers and brokers).
      components:
        numberOfNodes:
          path: spec.components.engine.replicas
          uiType: number
          fieldParams:
            label: Number of nodes
            defaultValue: 3
            helperText: Odd count required for KRaft controller quorum (1, 3, or 5).
            step: 2
          validation:
            int: true
            min: 1
            max: 5
            required: true
            celExpressions:
              - celExpr: "spec.components.engine.replicas % 2 == 1"
                message: "Number of dual-role nodes must be odd (KRaft controller quorum)"
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: spec.components.engine.resources.requests.cpu
              uiType: quantity
              fieldParams:
                label: CPU
                unitLabel: CPU
                defaultValue: 1
                step: 0.5
              validation:
                min: 0.5
                required: true
            memory:
              path: spec.components.engine.resources.requests.memory
              uiType: quantity
              fieldParams:
                label: Memory
                unit: Gi
                defaultValue: 2
                step: 0.5
              validation:
                min: 1
                required: true
            disk:
              path: spec.components.engine.storage.size
              uiType: quantity
              fieldParams:
                label: Disk
                unit: Gi
                defaultValue: 10
                helperText: Persistent volume size per node (JBOD volume 0).
              validation:
                int: true
                min: 1
                max: 1000
                required: true
          componentsOrder:
            - cpu
            - memory
            - disk
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          dataSource:
            provider: storageClasses
          fieldParams:
            label: Storage class
            modes:
              edit:
                disabled: true
              restore:
                disabled: true
          validation:
            required: false
      componentsOrder:
        - numberOfNodes
        - resources
        - storageClass
  sectionsOrder:
    - basicInfo
    - resources
